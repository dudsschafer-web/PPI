<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Display Block</title>

    <style>
        div {
            display: block;
            width: 100%;
            height: 50px;
            text-align: center;
        }

        #div1 {
            background-color: #6600ff;
        }

        #div2 {
            background-color: green;
        }

        #div3 {
            background-color: red;
        }

        #div4 {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <div id="div1">1</div>
    <div id="div2">2</div>
    <div id="div3">3</div>
    <div id="div4">4</div>

    <h1>Por que a exibição fica assim?</h1>
    <h2>A propriedade display: block faz com que cada elemento ocupe uma linha própria, ficando um abaixo do outro. <br>
        Como a largura foi definida em 100%, cada bloco ocupa toda a largura disponível do elemento pai.</h2>
        
</body>
</html>
